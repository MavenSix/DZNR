name: Routing Validation

on:
  pull_request:
    paths:
      - 'routing/**'
      - 'tests/**'
      - 'governance/EVOLUTION.md'
      - 'scripts/**'
      - 'agents/**'
      - '.claude-plugin/plugin.json'
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run routing validation
        run: |
          chmod +x scripts/validate-routing.sh
          ./scripts/validate-routing.sh

